<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>

    <script>
         let n = parseInt(prompt("Entrez un entier :"));

        if (n === 1) {
            console.log("Lundi");
        } 
        else if (n === 2) {
            console.log("Mardi");
        } 
        else if (n === 3) {
            console.log("Mercredi");
        } 
        else if (n === 4) {
            console.log("Jeudi");
        } 
        else if (n === 5) {
            console.log("Vendredi");
        } 
        else if (n === 6) {
            console.log("Samedi");
        } 
       else if (n === 7) {
            console.log("Dimanche");
        } 
        else {
            console.log("erreur : la valeur est invalide");
        }


    </script>
    
</body>
</html>
