<body>
    <script>
        let n = parseInt(prompt("Entrez un entier positif :"));

            while (isNaN(n) || n < 0) {
            n = parseInt(prompt("Erreur. Entrez un entier positif :"));
            }

        let f = 1;

        for (let i = 1; i <= n; i++) {
        f = f * i;
        }
            console.log(n + "! = " + f);
    </script>
