<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a=(prompt("entre un premier entier (entier positif) :"))

        while(isNaN(a)|| a<=0){
            a=(prompt("erreur.entre un premier entier (entier positif) :"))
        }
        let b=(prompt("entre une deuxieme entier (entier positif) :"))

        while(isNaN(b)||b<=0){
            b=(prompt("erreur.entre une deuxieme entier (entier positif) :"))
        }
        let x=Math.max(a.b)

        while (x % a !== 0 || x % b !== 0) {
                x--;
                }

            console.log("Le PGCD de " + a + " et " + b + " est " + x);
    </script>
    
</body>
