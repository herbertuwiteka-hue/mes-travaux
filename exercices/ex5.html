<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
       let n = parseInt(prompt("Entrez un entier :"));

        if (n === 1) {
            console.log("un");
        } 
        else if (n === 2) {
            console.log("deux");
        } 
        else if (n === 3) {
            console.log("trois");
        } 
        else if (n === 4) {
            console.log("quatre");
        } 
        else if (n === 5) {
            console.log("cinq");
        } 
        else {
            console.log("Le nombre n'est pas compris entre 1 et 5");
        }




    </script>
    
</body>
</html>
